<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xoce• Global CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        obsidian: '#09090b',
                        surface: '#121216',
                        glass: 'rgba(24, 24, 30, 0.72)'
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100dvh;
            max-height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #09090b;
            color: #f4f4f5;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
        .glass-panel {
            background: rgba(18, 18, 24, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-anim { animation: fadeSlide 0.2s ease-out forwards; }
    </style>
</head>
<body class="flex items-center justify-center sm:p-4 box-border bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-emerald-950/30 via-obsidian to-obsidian">

    <div id="app" class="w-full h-full max-w-6xl glass-panel sm:rounded-2xl flex overflow-hidden shadow-2xl min-h-0">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-72 border-r border-white/10 flex flex-col bg-surface/60 flex-shrink-0 min-h-0 hidden md:flex">
            <div class="p-4 border-b border-white/10 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <div id="my-avatar" class="w-10 h-10 rounded-xl flex items-center justify-center font-bold text-black shadow-lg flex-shrink-0" style="background:#10b981;">
                        U
                    </div>
                    <div class="min-w-0">
                        <input id="username-input" type="text" maxlength="24" placeholder="Tu nombre..." 
                               class="bg-transparent text-sm font-semibold text-white focus:outline-none border-b border-transparent focus:border-emerald-400 w-full truncate" />
                        <div class="flex items-center gap-1.5 text-[11px] text-emerald-400 font-mono mt-0.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                            <span>Conectado (PHP)</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Salas Públicas -->
            <div class="p-3 flex-1 overflow-y-auto min-h-0 space-y-1">
                <p class="px-2 py-1.5 text-[11px] font-semibold uppercase tracking-wider text-zinc-500">Salas Globales</p>
                
                <button onclick="switchRoom('general', 'Sala General', 'Chat público para todos los usuarios')" data-room="general"
                        class="room-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition bg-emerald-500/15 border border-emerald-500/30 text-white">
                    <span class="text-lg">🌐</span>
                    <div class="min-w-0">
                        <div class="text-sm font-medium truncate">Sala General</div>
                        <div class="text-xs text-zinc-400 truncate">Texto, imágenes y voz</div>
                    </div>
                </button>

                <button onclick="switchRoom('tech', 'Desarrollo & Código', 'Comparte snippets y proyectos')" data-room="tech"
                        class="room-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition hover:bg-white/5 text-zinc-300 border border-transparent">
                    <span class="text-lg">⚡</span>
                    <div class="min-w-0">
                        <div class="text-sm font-medium truncate">Desarrollo & Código</div>
                        <div class="text-xs text-zinc-400 truncate">Soporte y programación</div>
                    </div>
                </button>

                <button onclick="switchRoom('offtopic', 'Comunidad Libre', 'Charla abierta sin límites')" data-room="offtopic"
                        class="room-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition hover:bg-white/5 text-zinc-300 border border-transparent">
                    <span class="text-lg">🔥</span>
                    <div class="min-w-0">
                        <div class="text-sm font-medium truncate">Comunidad Libre</div>
                        <div class="text-xs text-zinc-400 truncate">Conversación general</div>
                    </div>
                </button>
            </div>

            <div class="p-3 border-t border-white/10 text-[11px] text-zinc-500 flex items-center justify-between flex-shrink-0">
                <span>MySQL + PHP Audio</span>
                <span id="msg-counter" class="font-mono text-zinc-400">0 msgs</span>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL DE CHAT -->
        <main class="flex-1 flex flex-col min-w-0 min-h-0 bg-obsidian/40">
            
            <!-- HEADER -->
            <header class="h-16 px-4 sm:px-6 border-b border-white/10 flex items-center justify-between flex-shrink-0 bg-surface/40">
                <div class="flex items-center gap-3 min-w-0">
                    <button onclick="toggleMobileSidebar()" class="md:hidden p-2 rounded-lg bg-white/5 text-zinc-300 hover:text-white">
                        ☰
                    </button>
                    <div class="min-w-0">
                        <h1 id="room-title" class="text-base font-bold text-white truncate">Sala General</h1>
                        <p id="room-desc" class="text-xs text-zinc-400 truncate">Chat público para todos los usuarios</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span id="sync-badge" class="text-[11px] font-mono px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                        ● En vivo
                    </span>
                </div>
            </header>

            <!-- MENSAJES -->
            <div id="messages-container" class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6 space-y-4">
                <div class="text-center text-xs text-zinc-500 py-8">Cargando historial de mensajes...</div>
            </div>

            <!-- PREVIEW DE IMAGEN ADJUNTA -->
            <div id="image-preview-bar" class="hidden px-4 py-2 bg-surface border-t border-white/10 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center gap-3">
                    <img id="image-preview-thumb" src="" class="h-12 w-12 object-cover rounded-lg border border-white/20">
                    <span class="text-xs text-zinc-300">Imagen lista para enviar</span>
                </div>
                <button onclick="clearImageAttachment()" class="text-xs text-red-400 hover:text-red-300 px-2 py-1">Quitar ✕</button>
            </div>

            <!-- CAJA DE ESCRITURA Y GRABACIÓN -->
            <footer class="p-3 sm:p-4 border-t border-white/10 bg-surface/60 flex-shrink-0">
                
                <!-- BARRA DE GRABACIÓN ACTIVA (Oculta por defecto) -->
                <div id="recording-bar" class="hidden flex items-center justify-between gap-3 max-w-4xl mx-auto bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-2.5">
                    <div class="flex items-center gap-3">
                        <span class="w-3 h-3 rounded-full bg-red-500 animate-ping"></span>
                        <span class="text-sm font-medium text-red-300">Grabando nota de voz...</span>
                        <span id="record-timer" class="font-mono text-sm text-white font-semibold">00:00</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="cancelRecording()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-300 hover:bg-white/10 transition">
                            Cancelar
                        </button>
                        <button type="button" onclick="stopAndSendRecording()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 hover:bg-emerald-400 text-black transition flex items-center gap-1.5 shadow-lg shadow-emerald-500/20">
                            <span>Enviar audio</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- FORMULARIO NORMAL -->
                <form id="chat-form" class="flex items-end gap-2 max-w-4xl mx-auto">
                    <!-- Adjuntar imagen -->
                    <label class="p-3 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 cursor-pointer transition flex-shrink-0" title="Adjuntar imagen">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <input id="image-input" type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    </label>

                    <!-- Input de texto -->
                    <div class="flex-1 bg-white/5 border border-white/10 focus-within:border-emerald-500/50 rounded-xl px-3.5 py-2.5 flex items-center">
                        <textarea id="message-input" rows="1" placeholder="Escribe un mensaje o graba un audio..." 
                                  class="w-full bg-transparent text-sm text-white placeholder-zinc-500 focus:outline-none resize-none max-h-28 leading-relaxed"></textarea>
                    </div>

                    <!-- Botón Micrófono (Nota de voz) -->
                    <button type="button" id="mic-btn" onclick="startRecording()" title="Grabar nota de voz"
                            class="p-3 rounded-xl bg-white/5 hover:bg-red-500/20 hover:text-red-400 text-zinc-300 transition flex-shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                        </svg>
                    </button>

                    <!-- Botón Enviar -->
                    <button type="submit" id="send-btn"
                            class="p-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-semibold transition shadow-lg shadow-emerald-500/20 flex-shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                    </button>
                </form>
            </footer>
        </main>
    </div>

    <script>
        const API_URL = 'api.php';
        const COLORS = ['#10b981', '#06b6d4', '#8b5cf6', '#f59e0b', '#ec4899', '#3b82f6'];

        let userId = localStorage.getItem('nexus_uid') || ('usr_' + Math.random().toString(36).substring(2, 9));
        let userName = localStorage.getItem('nexus_uname') || ('Usuario_' + userId.slice(-4).toUpperCase());
        let userColor = localStorage.getItem('nexus_ucolor') || COLORS[Math.floor(Math.random() * COLORS.length)];

        localStorage.setItem('nexus_uid', userId);
        localStorage.setItem('nexus_uname', userName);
        localStorage.setItem('nexus_ucolor', userColor);

        let currentRoom = 'general';
        let lastMessageId = 0;
        let attachedImageBase64 = null;
        let isFetching = false;

        // Variables de grabación de audio
        let mediaRecorder = null;
        let audioChunks = [];
        let recordTimerInterval = null;
        let recordSeconds = 0;
        let shouldSendAudio = false;
        let activeAudioPlayer = null;

        const usernameInput = document.getElementById('username-input');
        const myAvatar = document.getElementById('my-avatar');
        const messagesContainer = document.getElementById('messages-container');
        const messageInput = document.getElementById('message-input');

        usernameInput.value = userName;
        myAvatar.style.background = userColor;
        myAvatar.textContent = userName.charAt(0).toUpperCase();

        usernameInput.addEventListener('change', () => {
            const val = usernameInput.value.trim();
            if (val) {
                userName = val;
                localStorage.setItem('nexus_uname', userName);
                myAvatar.textContent = userName.charAt(0).toUpperCase();
            }
        });

        function switchRoom(room, title, desc) {
            if (currentRoom === room) return;
            currentRoom = room;
            lastMessageId = 0;
            document.getElementById('room-title').textContent = title;
            document.getElementById('room-desc').textContent = desc;
            messagesContainer.innerHTML = '<div class="text-center text-xs text-zinc-500 py-8">Cargando mensajes...</div>';

            document.querySelectorAll('.room-btn').forEach(btn => {
                if (btn.dataset.room === room) {
                    btn.className = 'room-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition bg-emerald-500/15 border border-emerald-500/30 text-white';
                } else {
                    btn.className = 'room-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition hover:bg-white/5 text-zinc-300 border border-transparent';
                }
            });

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
            }
            fetchMessages(true);
        }

        function toggleMobileSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('hidden');
            sb.classList.toggle('fixed');
            sb.classList.toggle('inset-y-0');
            sb.classList.toggle('left-0');
            sb.classList.toggle('z-50');
        }

        function formatText(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-white">$1</strong>')
                .replace(/`(.*?)`/g, '<code class="px-1.5 py-0.5 rounded bg-black/40 font-mono text-xs text-emerald-300">$1</code>')
                .replace(/\n/g, '<br>');
        }

        function formatTimeSeconds(sec) {
            if (!isFinite(sec) || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Reproductor de nota de voz personalizado
        function buildAudioPlayerHTML(msgId, audioUrl, isMine) {
            return `
                <div class="flex items-center gap-2.5 min-w-[210px] sm:min-w-[240px] py-1">
                    <button type="button" onclick="toggleAudioPlay(${msgId}, '${audioUrl}')" id="audio-btn-${msgId}"
                            class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 transition ${isMine ? 'bg-emerald-400 text-black hover:bg-emerald-300' : 'bg-white/15 text-white hover:bg-white/25'}">
                        <svg id="audio-icon-${msgId}" class="w-4 h-4 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </button>
                    <div class="flex-1 flex flex-col gap-1">
                        <div class="w-full h-1.5 bg-white/15 rounded-full overflow-hidden cursor-pointer" onclick="seekAudio(event, ${msgId})">
                            <div id="audio-bar-${msgId}" class="h-full ${isMine ? 'bg-emerald-400' : 'bg-cyan-400'} w-0 transition-all duration-100"></div>
                        </div>
                        <div class="flex justify-between text-[10px] font-mono text-zinc-400">
                            <span>Nota de voz</span>
                            <span id="audio-time-${msgId}">0:00</span>
                        </div>
                    </div>
                    <audio id="audio-el-${msgId}" src="${audioUrl}" preload="metadata"
                           onloadedmetadata="document.getElementById('audio-time-${msgId}').textContent = formatTimeSeconds(this.duration)"
                           ontimeupdate="updateAudioProgress(${msgId})"
                           onended="resetAudioUI(${msgId})"></audio>
                </div>
            `;
        }

        function toggleAudioPlay(msgId, url) {
            const audio = document.getElementById(`audio-el-${msgId}`);
            if (!audio) return;

            if (activeAudioPlayer && activeAudioPlayer !== audio) {
                activeAudioPlayer.pause();
                const prevId = activeAudioPlayer.id.replace('audio-el-', '');
                resetAudioUI(prevId, false);
            }

            if (audio.paused) {
                audio.play();
                activeAudioPlayer = audio;
                document.getElementById(`audio-icon-${msgId}`).innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                audio.pause();
                document.getElementById(`audio-icon-${msgId}`).innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
        }

        function updateAudioProgress(msgId) {
            const audio = document.getElementById(`audio-el-${msgId}`);
            const bar = document.getElementById(`audio-bar-${msgId}`);
            const timeEl = document.getElementById(`audio-time-${msgId}`);
            if (!audio || !bar) return;

            if (isFinite(audio.duration) && audio.duration > 0) {
                const pct = (audio.currentTime / audio.duration) * 100;
                bar.style.width = `${pct}%`;
            }
            timeEl.textContent = formatTimeSeconds(audio.currentTime);
        }

        function seekAudio(event, msgId) {
            const audio = document.getElementById(`audio-el-${msgId}`);
            if (!audio || !isFinite(audio.duration)) return;
            const rect = event.currentTarget.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
            audio.currentTime = ratio * audio.duration;
        }

        function resetAudioUI(msgId, resetBar = true) {
            const icon = document.getElementById(`audio-icon-${msgId}`);
            const bar = document.getElementById(`audio-bar-${msgId}`);
            const audio = document.getElementById(`audio-el-${msgId}`);
            const timeEl = document.getElementById(`audio-time-${msgId}`);
            if (icon) icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            if (resetBar && bar) bar.style.width = '0%';
            if (resetBar && audio && timeEl) timeEl.textContent = formatTimeSeconds(audio.duration);
        }

        function appendMessage(msg) {
            const isMine = msg.sender_id === userId;
            const time = new Date(msg.created_at.replace(' ', 'T')).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const wrapper = document.createElement('div');
            wrapper.id = `msg-${msg.id}`;
            wrapper.className = `flex gap-3 msg-anim group ${isMine ? 'flex-row-reverse' : ''}`;

            const avatar = `
                <div class="w-8 h-8 rounded-xl flex items-center justify-center text-xs font-bold text-black flex-shrink-0 mt-1" style="background:${msg.avatar_color || '#10b981'}">
                    ${(msg.sender_name || 'U').charAt(0).toUpperCase()}
                </div>
            `;

            const imgHtml = msg.image_data 
                ? `<img src="${msg.image_data}" class="mt-2 max-h-64 rounded-xl border border-white/10 cursor-pointer" onclick="window.open(this.src)">` 
                : '';

            const audioHtml = msg.audio_url
                ? buildAudioPlayerHTML(msg.id, msg.audio_url, isMine)
                : '';

            const reactionsHtml = renderReactions(msg.id, msg.reactions || {});

            wrapper.innerHTML = `
                ${avatar}
                <div class="max-w-[80%] sm:max-w-[68%] flex flex-col ${isMine ? 'items-end' : 'items-start'}">
                    <div class="flex items-center gap-2 mb-1 px-1">
                        <span class="text-xs font-medium text-zinc-300">${msg.sender_name}</span>
                        <span class="text-[10px] font-mono text-zinc-500">${time}</span>
                    </div>
                    <div class="relative px-4 py-2.5 rounded-2xl text-sm leading-relaxed break-words ${
                        isMine 
                        ? 'bg-emerald-500/20 border border-emerald-500/30 text-zinc-100 rounded-tr-sm' 
                        : 'bg-white/[0.06] border border-white/10 text-zinc-200 rounded-tl-sm'
                    }">
                        ${msg.content ? `<div>${formatText(msg.content)}</div>` : ''}
                        ${audioHtml}
                        ${imgHtml}
                        
                        <div class="opacity-0 group-hover:opacity-100 transition-opacity absolute -top-3 ${isMine ? 'left-0' : 'right-0'} flex items-center gap-1 bg-zinc-900 border border-white/15 rounded-full px-1.5 py-0.5 shadow-lg z-10">
                            ${['👍', '❤️', '🔥', '😂'].map(e => `<button type="button" onclick="toggleReaction(${msg.id}, '${e}')" class="hover:scale-125 transition text-xs px-0.5">${e}</button>`).join('')}
                        </div>
                    </div>
                    <div id="reactions-${msg.id}" class="flex flex-wrap gap-1 mt-1">${reactionsHtml}</div>
                </div>
            `;

            messagesContainer.appendChild(wrapper);
        }

        function renderReactions(msgId, reactions) {
            if (!reactions || typeof reactions !== 'object') return '';
            return Object.entries(reactions).map(([emoji, users]) => {
                if (!users || users.length === 0) return '';
                const active = users.includes(userId);
                return `<button onclick="toggleReaction(${msgId}, '${emoji}')" 
                    class="text-[11px] px-2 py-0.5 rounded-full border transition ${active ? 'bg-emerald-500/20 border-emerald-500/40 text-emerald-300' : 'bg-white/5 border-white/10 text-zinc-400'}">
                    ${emoji} ${users.length}
                </button>`;
            }).join('');
        }

        // --- GRABACIÓN DE NOTAS DE VOZ ---
        async function startRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Tu navegador no soporta grabación de audio o requiere conexión HTTPS.');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') 
                    ? 'audio/webm;codecs=opus' 
                    : (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus') ? 'audio/ogg;codecs=opus' : '');

                mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                audioChunks = [];
                shouldSendAudio = false;

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(track => track.stop());
                    clearInterval(recordTimerInterval);
                    document.getElementById('recording-bar').classList.add('hidden');
                    document.getElementById('chat-form').classList.remove('hidden');

                    if (shouldSendAudio && audioChunks.length > 0) {
                        const ext = mediaRecorder.mimeType.includes('ogg') ? 'ogg' : 'webm';
                        const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                        await sendVoiceMessage(audioBlob, ext);
                    }
                };

                mediaRecorder.start();
                recordSeconds = 0;
                document.getElementById('record-timer').textContent = '00:00';
                document.getElementById('chat-form').classList.add('hidden');
                document.getElementById('recording-bar').classList.remove('hidden');

                recordTimerInterval = setInterval(() => {
                    recordSeconds++;
                    const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
                    const s = String(recordSeconds % 60).padStart(2, '0');
                    document.getElementById('record-timer').textContent = `${m}:${s}`;
                    // Límite automático de 2 minutos
                    if (recordSeconds >= 120) stopAndSendRecording();
                }, 1000);

            } catch (err) {
                alert('No se pudo acceder al micrófono. Verifica los permisos del navegador.');
            }
        }

        function cancelRecording() {
            shouldSendAudio = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function stopAndSendRecording() {
            shouldSendAudio = true;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        async function sendVoiceMessage(audioBlob, ext) {
            const formData = new FormData();
            formData.append('room', currentRoom);
            formData.append('sender_id', userId);
            formData.append('sender_name', userName);
            formData.append('avatar_color', userColor);
            formData.append('audio', audioBlob, `voice.${ext}`);

            try {
                const res = await fetch(`${API_URL}?action=send`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    await fetchMessages(false);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                } else {
                    alert(data.message || 'Error al subir la nota de voz.');
                }
            } catch (err) {
                alert('Error de red al enviar el audio.');
            }
        }

        // --- SINCRONIZACIÓN Y ENVÍO DE TEXTO/IMAGEN ---
        async function fetchMessages(isInitial = false) {
            if (isFetching) return;
            isFetching = true;
            try {
                const res = await fetch(`${API_URL}?action=fetch&room=${encodeURIComponent(currentRoom)}&last_id=${lastMessageId}`);
                const data = await res.json();

                if (data.status === 'ok') {
                    if (isInitial) messagesContainer.innerHTML = '';

                    if (data.messages.length === 0 && isInitial) {
                        messagesContainer.innerHTML = '<div class="text-center text-xs text-zinc-500 py-10">Aún no hay mensajes en esta sala. ¡Sé el primero en escribir o enviar un audio!</div>';
                    }

                    const wasAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 100;

                    data.messages.forEach(msg => {
                        if (msg.id > lastMessageId) {
                            if (lastMessageId === 0 && messagesContainer.querySelector('.text-center')) {
                                messagesContainer.innerHTML = '';
                            }
                            appendMessage(msg);
                            lastMessageId = msg.id;
                        }
                    });

                    if (data.messages.length > 0 && (wasAtBottom || isInitial)) {
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }

                    document.getElementById('msg-counter').textContent = `${document.querySelectorAll('[id^="msg-"]').length} msgs`;
                }
            } catch (err) {
                console.error('Error sincronizando con PHP:', err);
            } finally {
                isFetching = false;
            }
        }

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text && !attachedImageBase64) return;

            const payload = {
                room: currentRoom,
                sender_id: userId,
                sender_name: userName,
                avatar_color: userColor,
                content: text,
                image_data: attachedImageBase64
            };

            messageInput.value = '';
            messageInput.style.height = 'auto';
            clearImageAttachment();

            try {
                const res = await fetch(`${API_URL}?action=send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    await fetchMessages(false);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            } catch (err) {
                alert('Error al enviar el mensaje al servidor PHP.');
            }
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('chat-form').dispatchEvent(new Event('submit'));
            }
        });

        async function toggleReaction(msgId, emoji) {
            try {
                const res = await fetch(`${API_URL}?action=react`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message_id: msgId, emoji, user_id: userId })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    const container = document.getElementById(`reactions-${msgId}`);
                    if (container) container.innerHTML = renderReactions(msgId, data.reactions);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scale = Math.min(1, MAX_WIDTH / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    attachedImageBase64 = canvas.toDataURL('image/jpeg', 0.75);
                    document.getElementById('image-preview-thumb').src = attachedImageBase64;
                    document.getElementById('image-preview-bar').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearImageAttachment() {
            attachedImageBase64 = null;
            document.getElementById('image-input').value = '';
            document.getElementById('image-preview-bar').classList.add('hidden');
        }

        fetchMessages(true);
        setInterval(() => fetchMessages(false), 1500);
    </script>
</body>
</html>
